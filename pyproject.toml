[project]
name = "cognate"
version = "0.1.0"
description = "TCR-epitope binding baselines on IMMREP23"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "biopython>=1.84",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognate"]
